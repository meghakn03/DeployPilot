name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: test -z "$(gofmt -l api cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - run: kubectl kustomize config/default
      - run: docker build -t deploypilot:ci .
