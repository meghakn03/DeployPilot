apiVersion: deploypilot.io/v1alpha1
kind: DeploymentRequest
metadata:
  name: hello
  namespace: demo
spec:
  image: ghcr.io/example/hello:v1
  replicas: 2
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  readinessProbe:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
